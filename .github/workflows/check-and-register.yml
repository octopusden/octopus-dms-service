name: Check for artifact and register release

on:
  workflow_run:
    workflows: ["Gradle Release"]
    types:
      - completed

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-check-and-register-release.yml@v2.7.0
    if:  "${{ github.event.workflow_run.conclusion == 'success' }}"
    with:
      # Gate on a coordinate that is actually published to Maven Central. The dms-service
      # module is a docker deployable and no longer publishes a jar, so polling for it would
      # never resolve; `client` is released from the same version and is a real dependency.
      artifact-pattern: "octopus/dms/client/_VER_/client-_VER_.jar"
    secrets: inherit
